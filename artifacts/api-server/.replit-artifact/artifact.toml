kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "node -e \"const u=new URL('postgresql://x');u.username=process.env.PGUSER||'';u.password=process.env.PGPASSWORD||'';u.hostname=process.env.PGHOST||'localhost';u.port=process.env.PGPORT||'5432';u.pathname='/'+(process.env.PGDATABASE||'postgres');u.searchParams.set('sslmode','require');process.env.DATABASE_URL=u.href;const {execFileSync}=require('child_process');execFileSync('pnpm',['--filter','@workspace/api-server','run','dev'],{stdio:'inherit',env:process.env})\""

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
