<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>GRAM Operações</title>
    <meta name="description" content="Painel de Serviços — Grupo Rede Amazônica, Departamento de Operações." />
    <meta name="robots" content="index, follow" />
    <meta name="google" content="notranslate" />

    <!-- PWA core -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA — Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GRAM" />

    <!-- PWA — iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GRAM Operações" />

    <!-- PWA — Windows -->
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="GRAM Operações" />
    <meta property="og:description" content="Painel de Serviços — Grupo Rede Amazônica, Departamento de Operações." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRAM Operações" />
    <meta name="twitter:description" content="Painel de Serviços — Grupo Rede Amazônica, Departamento de Operações." />

    <!-- Fonts: preconnect first, then load only weight 400+500+600+700 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      /* Splash screen shown before JS executes */
      #splash {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #splash img { width: 72px; height: 72px; object-fit: contain; border-radius: 16px; }
      #splash p { color: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 13px; margin-top: 14px; letter-spacing: 0.02em; }
      #splash small { color: #334155; font-family: Inter, system-ui, sans-serif; font-size: 11px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo-amazonica.png" alt="Logo" />
      <p>GRAM Operações</p>
      <small>Grupo Rede Amazônica</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
