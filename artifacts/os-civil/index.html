<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>GRAM Operações</title>
    <meta name="description" content="Painel de Serviços — Grupo Rede Amazônica, Departamento de Operações." />
    <meta name="robots" content="index, follow" />
    <meta name="google" content="notranslate" />

    <!-- PWA core -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA — Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GRAM" />

    <!-- PWA — iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GRAM Operações" />

    <!-- PWA — Windows -->
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="GRAM Operações" />
    <meta property="og:description" content="Painel de Serviços — Grupo Rede Amazônica, Departamento de Operações." />
    <meta property="og:type" content="website" />

    <!-- Fonts: non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      /* ── Splash screen ── */
      #splash {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
        gap: 0;
      }
      #splash-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        border-radius: 0;
        animation: splashPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #splash-name {
        margin-top: 20px;
        font-family: Inter, system-ui, sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: 0.03em;
        animation: splashFade 0.5s ease 0.2s both;
      }
      #splash-sub {
        margin-top: 6px;
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        color: #475569;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        animation: splashFade 0.5s ease 0.35s both;
      }
      #splash-bar {
        margin-top: 40px;
        width: 48px;
        height: 3px;
        border-radius: 99px;
        background: linear-gradient(90deg, #1e40af, #3b82f6, #1e40af);
        background-size: 200% 100%;
        animation: splashFade 0.5s ease 0.4s both, shimmer 1.4s linear infinite;
      }
      @keyframes splashPop {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splashFade {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img id="splash-logo" src="/logo-amazonica.png" alt="GRAM Operações" />
      <div id="splash-name">GRAM Operações</div>
      <div id="splash-sub">Grupo Rede Amazônica</div>
      <div id="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
