openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Sistema de Ordem de Serviço - Construção Civil, Manutenção e Limpeza
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: service-orders
  - name: technicians
  - name: dashboard
  - name: contacts
  - name: settings
  - name: suppliers
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /service-orders:
    get:
      operationId: listServiceOrders
      tags: [service-orders]
      summary: Listar ordens de serviço
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
        - name: formatoServico
          in: query
          schema:
            type: string
        - name: technicianId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, monthly, annual]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de ordens de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceOrder"

    post:
      operationId: createServiceOrder
      tags: [service-orders]
      summary: Criar ordem de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderInput"
      responses:
        "201":
          description: OS criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

  /service-orders/{id}:
    get:
      operationId: getServiceOrder
      tags: [service-orders]
      summary: Buscar OS por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordem de serviço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "404":
          description: Não encontrado

    patch:
      operationId: updateServiceOrder
      tags: [service-orders]
      summary: Atualizar OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderUpdate"
      responses:
        "200":
          description: OS atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

    delete:
      operationId: deleteServiceOrder
      tags: [service-orders]
      summary: Deletar OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deletado

  /service-orders/{id}/status:
    patch:
      operationId: updateServiceOrderStatus
      tags: [service-orders]
      summary: Atualizar status da OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

  /service-orders/{id}/sign:
    post:
      operationId: signServiceOrder
      tags: [service-orders]
      summary: Assinar e concluir OS (pelo gestor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureInput"
      responses:
        "200":
          description: OS assinada e concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Resumo do dashboard com indicadores
      parameters:
        - name: unidade
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Estatísticas por período
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, monthly, annual]
            default: monthly
      responses:
        "200":
          description: Estatísticas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatPoint"

  /dashboard/indicators:
    get:
      operationId: getDashboardIndicators
      tags: [dashboard]
      summary: Indicadores por local, mês e responsável com projeção de valor
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: date
          in: query
          description: Filtra indicadores para um dia específico (YYYY-MM-DD)
          schema:
            type: string
      responses:
        "200":
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorsData"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: Listar contatos/funcionários
      responses:
        "200":
          description: Lista de contatos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Cadastrar contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contato criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Atualizar contato
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "200":
          description: Contato atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Deletar contato
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deletado

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: Listar fornecedores
      responses:
        "200":
          description: Lista de fornecedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Cadastrar fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Fornecedor criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Buscar fornecedor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fornecedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Não encontrado
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Atualizar fornecedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Fornecedor atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Deletar fornecedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deletado

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Buscar configurações
      responses:
        "200":
          description: Configurações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsData"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Atualizar configurações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsData"
      responses:
        "200":
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsData"

  /technicians:
    get:
      operationId: listTechnicians
      tags: [technicians]
      summary: Listar técnicos
      parameters:
        - name: unidade
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de técnicos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technician"

    post:
      operationId: createTechnician
      tags: [technicians]
      summary: Cadastrar técnico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianInput"
      responses:
        "201":
          description: Técnico criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

  /technicians/{id}:
    patch:
      operationId: updateTechnician
      tags: [technicians]
      summary: Atualizar técnico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianUpdate"
      responses:
        "200":
          description: Técnico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

    delete:
      operationId: deleteTechnician
      tags: [technicians]
      summary: Deletar técnico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deletado

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ServiceOrder:
      type: object
      required:
        - id
        - number
        - title
        - category
        - priority
        - status
        - location
        - createdAt
      properties:
        id:
          type: integer
        number:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
          enum: [manutencao, conservacao, limpeza, preventiva, construcao]
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        status:
          type: string
          enum: [aberta, em_andamento, concluida, cancelada]
        location:
          type: string
        department:
          type: ["string", "null"]
        technicianId:
          type: ["integer", "null"]
        technicianName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        tipo:
          type: ["string", "null"]
          enum: [reforma, revitalizacao, preventiva, corretiva, outros, "null"]
        formatoServico:
          type: ["string", "null"]
          enum: [civil, refrigeracao, hidraulica, mecanica, eletrica, outros, "null"]
        photos:
          type: ["string", "null"]
          description: JSON array of base64 image strings
        signature:
          type: ["string", "null"]
          description: Base64 signature image
        signedBy:
          type: ["string", "null"]
        signedAt:
          type: ["string", "null"]
        estimatedValue:
          type: ["number", "null"]
        scheduledAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ServiceOrderInput:
      type: object
      required:
        - category
        - priority
        - location
      properties:
        title:
          type: string
          description: Gerado automaticamente se não informado
        description:
          type: string
        category:
          type: string
          enum: [manutencao, conservacao, limpeza, preventiva, construcao]
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        location:
          type: string
        department:
          type: string
        technicianName:
          type: string
          description: Nome livre do técnico responsável
        notes:
          type: string
        tipo:
          type: string
          enum: [reforma, revitalizacao, preventiva, corretiva, outros]
        formatoServico:
          type: string
          enum: [civil, refrigeracao, hidraulica, mecanica, eletrica, outros]
        photos:
          type: string
        scheduledAt:
          type: string

    ServiceOrderUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [manutencao, conservacao, limpeza, preventiva, construcao]
        priority:
          type: string
          enum: [baixa, media, alta, urgente]
        status:
          type: string
          enum: [aberta, em_andamento, concluida, cancelada]
        location:
          type: string
        department:
          type: string
        technicianName:
          type: string
          description: Nome livre do técnico responsável
        notes:
          type: string
        tipo:
          type: string
          enum: [reforma, revitalizacao, preventiva, corretiva, outros]
        formatoServico:
          type: string
          enum: [civil, refrigeracao, hidraulica, mecanica, eletrica, outros]
        photos:
          type: string
        scheduledAt:
          type: string
        completedAt:
          type: string

    StatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [aberta, em_andamento, concluida, cancelada]
        notes:
          type: string

    SignatureInput:
      type: object
      required:
        - signedBy
      properties:
        signedBy:
          type: string
        signature:
          type: string
          description: Base64 signature image (optional if clicking to confirm)

    DashboardSummary:
      type: object
      required:
        - totalOpen
        - totalInProgress
        - totalCompleted
        - totalCancelled
        - totalToday
        - totalThisMonth
        - totalThisYear
        - byCategory
        - byPriority
        - completionRate
        - totalEstimatedValue
      properties:
        totalOpen:
          type: integer
        totalInProgress:
          type: integer
        totalCompleted:
          type: integer
        totalCancelled:
          type: integer
        totalToday:
          type: integer
        totalThisMonth:
          type: integer
        totalThisYear:
          type: integer
        completionRate:
          type: number
        totalEstimatedValue:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byPriority:
          type: array
          items:
            $ref: "#/components/schemas/PriorityCount"

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    PriorityCount:
      type: object
      required: [priority, count]
      properties:
        priority:
          type: string
        count:
          type: integer

    StatPoint:
      type: object
      required: [label, total, completed, open, inProgress]
      properties:
        label:
          type: string
        total:
          type: integer
        completed:
          type: integer
        open:
          type: integer
        inProgress:
          type: integer

    IndicatorsData:
      type: object
      required: [byLocation, byMonth, byTechnician, byFormatoServico, totalValue]
      properties:
        totalValue:
          type: number
        byLocation:
          type: array
          items:
            $ref: "#/components/schemas/LocationIndicator"
        byMonth:
          type: array
          items:
            $ref: "#/components/schemas/MonthIndicator"
        byTechnician:
          type: array
          items:
            $ref: "#/components/schemas/TechnicianIndicator"
        byFormatoServico:
          type: array
          items:
            $ref: "#/components/schemas/FormatoIndicator"

    LocationIndicator:
      type: object
      required: [location, total, completed, estimatedValue]
      properties:
        location:
          type: string
        total:
          type: integer
        completed:
          type: integer
        estimatedValue:
          type: number

    MonthIndicator:
      type: object
      required: [month, total, completed, estimatedValue]
      properties:
        month:
          type: string
        total:
          type: integer
        completed:
          type: integer
        estimatedValue:
          type: number

    TechnicianIndicator:
      type: object
      required: [technicianName, total, completed, estimatedValue]
      properties:
        technicianName:
          type: string
        total:
          type: integer
        completed:
          type: integer
        estimatedValue:
          type: number

    FormatoIndicator:
      type: object
      required: [formato, total, estimatedValue, avgValuePerService]
      properties:
        formato:
          type: string
        total:
          type: integer
        estimatedValue:
          type: number
        avgValuePerService:
          type: number

    Technician:
      type: object
      required:
        - id
        - name
        - specialty
        - active
        - unidade
        - isCorporate
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        specialty:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        active:
          type: boolean
        unidade:
          type: string
        area:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        photoUrl:
          type: ["string", "null"]
        isCorporate:
          type: boolean
        createdAt:
          type: string

    TechnicianInput:
      type: object
      required:
        - name
        - specialty
      properties:
        name:
          type: string
          minLength: 1
        specialty:
          type: string
        phone:
          type: string
        email:
          type: string
        unidade:
          type: string
        area:
          type: ["string", "null"]
        position:
          type: string
        managerId:
          type: ["integer", "null"]
        photoUrl:
          type: ["string", "null"]

    TechnicianUpdate:
      type: object
      properties:
        name:
          type: string
        specialty:
          type: string
        phone:
          type: string
        email:
          type: string
        active:
          type: boolean
        unidade:
          type: string
        area:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        photoUrl:
          type: ["string", "null"]
        isCorporate:
          type: boolean

    Contact:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        cpf:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ContactInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        cpf:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        birthDate:
          type: string
        notes:
          type: string

    Supplier:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: integer
        cnpjCpf:
          type: ["string", "null"]
        razaoSocial:
          type: ["string", "null"]
        endereco:
          type: ["string", "null"]
        uf:
          type: ["string", "null"]
        cidade:
          type: ["string", "null"]
        contato:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
